[package]
name = "gpui_hexeditor"
version = "0.3.0"
edition = "2024"
description = "A reusable hex editor widget for GPUI applications"
license = "MIT"
repository = "https://github.com/Modolet/gpui_hexeditor"
homepage = "https://github.com/Modolet/gpui_hexeditor"
documentation = "https://docs.rs/gpui_hexeditor"
readme = "README.md"
keywords = ["gpui", "hex", "editor", "gui"]
categories = ["gui"]
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/src/**",
    "/examples/**",
]

[dependencies]
gpui-kit = { version = "0.9.0", default-features = false, features = ["component"] }

[dev-dependencies]
gpui-kit = { version = "0.9.0", default-features = false, features = ["component", "test-support"] }
pretty_assertions = "1.4.1"

[package.metadata.docs.rs]
all-features = true

[workspace]
