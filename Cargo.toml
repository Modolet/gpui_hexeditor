[package]
name = "gpui_hexeditor"
version = "0.1.0"
edition = "2024"
description = "A reusable hex editor widget for GPUI applications"
license = "MIT"
repository = "https://github.com/Modolet/gpui_hexeditor"
homepage = "https://github.com/Modolet/gpui_hexeditor"
documentation = "https://docs.rs/gpui_hexeditor"
readme = "README.md"
keywords = ["gpui", "hex", "editor", "gui"]
categories = ["gui"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "src/**",
    "examples/**",
]

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git" }
gpui-component = { git = "https://github.com/longbridge/gpui-component.git" }

[dev-dependencies]
gpui_platform = { git = "https://github.com/zed-industries/zed.git", features = ["font-kit"] }
pretty_assertions = "1.4.1"

[package.metadata.docs.rs]
all-features = true
